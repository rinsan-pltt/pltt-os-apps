[project]
name = "palette-plugin-pltt-creative"
version = "1.2.9"
description = "Pltt Creative — multi-provider AI image and video generation Palette plugin"
requires-python = ">=3.12"
# palette-sdk is provided on PYTHONPATH by the Palette CLI (`pltt dev`,
# `pltt test`) and by the platform runtime in hosted environments. Pin a
# released wheel here only if you run pytest/IDE imports outside the CLI:
#
# dependencies = [
#     "palette-sdk @ https://github.com/palette-lab/palette-virtual-organization-backend/releases/download/sdk-backend-vX.Y.Z/palette_sdk-X.Y.Z-py3-none-any.whl",
# ]
dependencies = [
    "fastapi>=0.129.0",
    "sqlalchemy>=2.0.47",
    "pydantic>=2.0",
    "httpx>=0.27",
    "fal-client>=0.5",
    "runware>=0.4",
    "python-multipart>=0.0.9",
    "anyio>=4.0",
    # Chat agent (LangGraph): OpenAI primary, Gemini fallback
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    # Tracing/observability for the chat agent (activated by the
    # LANGSMITH_API_KEY plugin secret; harmless when unset)
    "langsmith>=0.1",
]

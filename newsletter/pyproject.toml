[project]
name = "newsletter"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.129.0",
  "sqlalchemy>=2.0.47",
  "alembic>=1.17.0",
  "asyncpg>=0.31.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.32",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "tiktoken>=0.7.0",
  "weasyprint>=62.0",
  "jinja2>=3.1.0",
  "pydantic-settings>=2.5.0",
  "pillow>=10.3.0",
  # Standalone-mode-only fallback when ctx.storage is unavailable — see storage.py.
  "google-cloud-storage>=2.16.0",
  # `pltt test` ships the backend SDK on PYTHONPATH.
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

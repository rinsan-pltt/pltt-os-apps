# Postgres helper in the same format as the reference plugin's compose file.
# The file-convertor plugin declares `database: false` in palette-plugin.json,
# so nothing requires this today — it's here for parity with the reference
# layout and ready for the day the plugin adds a database.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: file-convertor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: palette_user
      POSTGRES_PASSWORD: palette_user_password
      POSTGRES_DB: file_convertor
    ports:
      - "5455:5432"
    volumes:
      - file_convertor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palette_user -d file_convertor"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  file_convertor_pg_data:
